modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''Independent Millénaire addon: kingdoms and capitals, rare natural NPC capitals, NPC kingdoms that join villages, declare war, send real Millénaire conquest raids and make peace, player rulers with a kingdom screen, daily income and a real coin treasury in the capital town hall.'''

[[mixins]]
config="millenairekingdoms.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="millenaire"
type="required"
versionRange="[${millenaire_version}]"
ordering="AFTER"
side="BOTH"

[features.${mod_id}]
javaVersion="[21,)"
