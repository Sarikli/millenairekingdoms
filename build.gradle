plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id
base.archivesName = mod_id

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    gametestImplementation.extendsFrom implementation
    gametestRuntimeOnly.extendsFrom runtimeOnly
}

def stageServerJar = tasks.register('stageServerJar', Copy) {
    from tasks.named('jar')
    into layout.projectDirectory.dir('run/server-jar/mods')
    rename { 'millenairekingdoms.jar' }
}
def stageGameTestJar = tasks.register('stageGameTestJar', Copy) {
    from tasks.named('jar')
    into layout.projectDirectory.dir('run/gametest/mods')
    rename { 'millenairekingdoms.jar' }
}

