def millenaireJar = layout.projectDirectory.file("millenaire-${millenaire_version}.jar")

dependencies {
    // Available for compilation and development runs; never embedded in our JAR.
    implementation files(millenaireJar)
}

def verifyMillenaireJar = tasks.register('verifyMillenaireJar') {
    group = 'verification'
    description = 'Checks that the original Millénaire dependency is present and unchanged.'
    inputs.file(millenaireJar)
    inputs.property('expectedSha256', millenaire_sha256)
    doLast {
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        millenaireJar.asFile.withInputStream { stream ->
            byte[] buffer = new byte[8192]
            int count
            while ((count = stream.read(buffer)) != -1) {
                digest.update(buffer, 0, count)
            }
        }
        def actual = digest.digest().encodeHex().toString()
        if (actual != inputs.properties.expectedSha256) {
            throw new GradleException("Original Millénaire JAR checksum mismatch: ${actual}")
        }
        logger.lifecycle("Original Millénaire ${millenaire_version} SHA-256 verified: ${actual}")
    }
}

def metadataProperties = [
    mod_id: mod_id,
    mod_name: mod_name,
    mod_version: mod_version,
    mod_license: mod_license,
    minecraft_version_range: minecraft_version_range,
    neo_version_range: neo_version_range,
    loader_version_range: loader_version_range,
    millenaire_version: millenaire_version
]

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    inputs.properties(metadataProperties)
    filteringCharset = 'UTF-8'
    expand(metadataProperties)
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}

sourceSets.main.resources.srcDir(generateModMetadata)
neoForge.ideSyncTask(generateModMetadata)

tasks.named('processGametestResources', ProcessResources) {
    inputs.property('mod_version', mod_version)
    filesMatching('META-INF/neoforge.mods.toml') { expand(mod_version: mod_version) }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('compileJava') { dependsOn verifyMillenaireJar }
tasks.named('check') { dependsOn verifyMillenaireJar }
tasks.named('check') { dependsOn tasks.named('gametestClasses') }
tasks.named('runGameTestServerReload') { dependsOn tasks.named('runGameTestServer') }
tasks.named('runServer', JavaExec) { standardInput = System.in }
tasks.named('runServerJar', JavaExec) { standardInput = System.in }
tasks.register('verifyConquest') {
    group = 'verification'
    description = 'Runs real server integration tests, then restarts the server to verify persisted progress.'
    dependsOn tasks.named('runGameTestServerReload')
}
tasks.named('jar', Jar) {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    manifest.attributes('Implementation-Title': mod_name, 'Implementation-Version': mod_version)
}

tasks.named('wrapper', Wrapper) {
    gradleVersion = '8.14.3'
    distributionType = Wrapper.DistributionType.BIN
}

// Focused stage-4.1 suite; does not execute the broader conquest/NPC test suites.
tasks.named('runWarGameTestServerReload') { dependsOn tasks.named('runWarGameTestServer') }
tasks.register('verifyWars') {
    group = 'verification'
    description = 'Runs only war/peace tests and verifies war persistence after a server restart.'
    dependsOn tasks.named('runWarGameTestServerReload')
}

// Stage-5 suite (rulers, economy, diplomacy): write round, then a separate JVM checks persistence.
tasks.named('runStage5GameTestServerReload') { dependsOn tasks.named('runStage5GameTestServer') }
tasks.register('verifyStage5') {
    group = 'verification'
    description = 'Runs only stage-5 politics, economy and diplomacy tests, then verifies persistence after a restart.'
    dependsOn tasks.named('runStage5GameTestServerReload')
}

// Stage-6.1 suite (natural NPC capitals): write round, then a separate JVM checks the capital after a restart.
tasks.named('runCapitalGameTestServerReload') { dependsOn tasks.named('runCapitalGameTestServer') }
tasks.register('verifyCapitals') {
    group = 'verification'
    description = 'Runs only the natural-capital tests on real Millénaire villages, then verifies them after a restart.'
    dependsOn tasks.named('runCapitalGameTestServerReload')
}

// Stage-6.2 suite (NPC autonomy, conquest orders, peace): write round, then a separate JVM checks persistence.
tasks.named('runAutonomyGameTestServerReload') { dependsOn tasks.named('runAutonomyGameTestServer') }
tasks.register('verifyAutonomy') {
    group = 'verification'
    description = 'Runs only the stage-6.2 NPC politics and conquest-order tests, then verifies persistence after a restart.'
    dependsOn tasks.named('runAutonomyGameTestServerReload')
}

// Kingdom screen and treasury suite: server-side action checks and real coin withdrawals, then a restart round.
tasks.named('runGuiGameTestServerReload') { dependsOn tasks.named('runGuiGameTestServer') }
