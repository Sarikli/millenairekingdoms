}
tasks.named('runRoyalConstructionGameTestServerReload') { dependsOn tasks.named('runRoyalConstructionGameTestServer') }
tasks.register('verifyRoyalConstruction') {
    group = 'verification'
    description = 'Verify royal construction in a write JVM and a separate reload JVM.'
    dependsOn tasks.named('runRoyalConstructionGameTestServerReload')
}

tasks.named('runRoyalRecoveryGameTestServerReload') { dependsOn tasks.named('runRoyalRecoveryGameTestServer') }
tasks.register('verifyRoyalRecovery') {
    group = 'verification'
    description = 'Verify audited operator construction recovery in two separate JVMs.'
    dependsOn tasks.named('runRoyalRecoveryGameTestServerReload')
}

tasks.named('runRoyalSitesGameTestServerReload') { dependsOn tasks.named('runRoyalSitesGameTestServer') }
tasks.register('verifyRoyalSites') {
