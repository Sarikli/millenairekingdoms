neoForge {
    version = project.neo_version
    addModdingDependenciesTo(sourceSets.gametest)

    mods {
        "${mod_id}" { sourceSet sourceSets.main }
        millenairekingdoms_tests { sourceSet sourceSets.gametest }
    }

    runs {
        client {
            client()
            loadedMods = [mods.millenairekingdoms]
            gameDirectory = file('run/client')
        }
        server {
            server()
            loadedMods = [mods.millenairekingdoms]
            gameDirectory = file('run/server')
            programArgument '--nogui'
        }
        serverJar {
            server()
            loadedMods = []
            gameDirectory = file('run/server-jar')
            programArgument '--nogui'
            taskBefore stageServerJar
        }

        def registerGameTestRun = { String runName, String namespace, Map<String, String> sysProps ->
            create(runName) {
                type = 'gameTestServer'
                sourceSet = sourceSets.gametest
                loadedMods = [mods.millenairekingdoms_tests]
                taskBefore stageGameTestJar
                gameDirectory = file('run/gametest')
                systemProperty 'neoforge.enabledGameTestNamespaces', namespace
                sysProps.each { k, v -> systemProperty k, v }
            }
        }

        pairedGameTestSuites.each { suite ->
            def extra = suite.props ?: [:]
            registerGameTestRun(suite.run, suite.ns, ['kingdoms.tests.persistence': 'write'] + extra)
            registerGameTestRun("${suite.run}Reload", suite.ns, ['kingdoms.tests.persistence': 'read'] + extra)
        }
        extraGameTestRuns.each { spec ->
            registerGameTestRun(spec.run, spec.ns, spec.props)
        }

        configureEach {
            logLevel = org.slf4j.event.Level.INFO
            jvmArguments.addAll '-Xms512m', '-Xmx3G'
        }
    }
}

def millenaireJar = layout.projectDirectory.file("millenaire-${millenaire_version}.jar")

dependencies {
    implementation files(millenaireJar)
}

def verifyMillenaireJar = tasks.register('verifyMillenaireJar') {
    group = 'verification'
    description = 'Checks that the original Millénaire dependency is present and unchanged.'
    inputs.file(millenaireJar)
    inputs.property('expectedSha256', millenaire_sha256)
    doLast {
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        millenaireJar.asFile.withInputStream { stream ->
            byte[] buffer = new byte[8192]
            int count
            while ((count = stream.read(buffer)) != -1) {
                digest.update(buffer, 0, count)
            }
        }
        def actual = digest.digest().encodeHex().toString()
        if (actual != inputs.properties.expectedSha256) {
            throw new GradleException("Original Millénaire JAR checksum mismatch: ${actual}")
        }
        logger.lifecycle("Original Millénaire ${millenaire_version} SHA-256 verified: ${actual}")
    }
}

def metadataProperties = [
    mod_id: mod_id,
    mod_name: mod_name,
    mod_version: mod_version,
    mod_license: mod_license,
    minecraft_version_range: minecraft_version_range,
    neo_version_range: neo_version_range,
    loader_version_range: loader_version_range,
    millenaire_version: millenaire_version
]

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    inputs.properties(metadataProperties)
    filteringCharset = 'UTF-8'
    expand(metadataProperties)
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}

sourceSets.main.resources.srcDir(generateModMetadata)
neoForge.ideSyncTask(generateModMetadata)

tasks.named('processGametestResources', ProcessResources) {
    inputs.property('mod_version', mod_version)
    filesMatching('META-INF/neoforge.mods.toml') { expand(mod_version: mod_version) }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('compileJava') { dependsOn verifyMillenaireJar }
tasks.named('check') { dependsOn verifyMillenaireJar, tasks.named('gametestClasses') }
tasks.named('runServer', JavaExec) { standardInput = System.in }
tasks.named('runServerJar', JavaExec) { standardInput = System.in }

tasks.named('jar', Jar) {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    filePermissions { unix(0644) }
    dirPermissions { unix(0755) }
    from('LICENSE') { into 'META-INF' }
    manifest.attributes('Implementation-Title': mod_name, 'Implementation-Version': mod_version)
}

tasks.named('wrapper', Wrapper) {
    gradleVersion = '8.14.3'
    distributionType = Wrapper.DistributionType.BIN
}

pairedGameTestSuites.each { suite ->
    def cap = suite.run.capitalize()
    tasks.named("run${cap}Reload") { dependsOn tasks.named("run${cap}") }
    tasks.register(suite.verify) {
        group = 'verification'
        dependsOn tasks.named("run${cap}Reload")
    }
}

tasks.named('runRoyalSimulationGameTestServerReload') { dependsOn tasks.named('runRoyalSimulationGameTestServer') }
tasks.named('runRoyalSimulationGameTestServerThird')  { dependsOn tasks.named('runRoyalSimulationGameTestServerReload') }
tasks.named('runRoyalSimulationGameTestServerFourth') { dependsOn tasks.named('runRoyalSimulationGameTestServerThird') }
tasks.register('verifyRoyalSimulation') {
    group = 'verification'
    dependsOn tasks.named('runRoyalSimulationGameTestServerFourth')
}
